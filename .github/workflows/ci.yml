name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Verify runtime
        run: .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12)' && ffmpeg -version
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Verify browser workflows
        run: |
          .venv/bin/python -m pip install 'playwright>=1.48,<2'
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python -m scripts.check_ui
  devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Codespaces image
        run: docker build -t shortflow-codespaces .devcontainer
      - name: Test in Codespaces image
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace shortflow-codespaces
          bash -c 'python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.txt && .venv/bin/python -m pytest -q'
      - name: Validate real local narration and video
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace shortflow-codespaces
          .venv/bin/python -m scripts.check_media
      - name: Validate a real local story model (opt-in)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[model-smoke]'))
        timeout-minutes: 25
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace shortflow-codespaces
          .venv/bin/python -m scripts.check_story_model

      - name: Compare alternative local story model (opt-in)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[gemma-smoke]')
        timeout-minutes: 25
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace shortflow-codespaces
          .venv/bin/python -m scripts.check_story_model --gemma
  story-evaluation:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[story-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(contains(github.event.head_commit.message, '[story-eval-convivencia]') && '["convivencia"]' || '["familia","trabajo","convivencia"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Codespaces image
        run: docker build -t shortflow-codespaces .devcontainer
      - name: Generate real story for editorial review
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace shortflow-codespaces
          bash -c 'python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt && .venv/bin/python -m scripts.evaluate_stories ${{ matrix.case }}'
